# Render.com deployment configuration for PressClub
#
# Render Dashboard -> Your Service -> Environment -> Environment Variables
#
# REQUIRED (set these or they will be prompted during deploy):
#   OWNER_EMAIL  - email that receives verification/contact notifications
#   MAIL_FROM    - sender on outgoing emails, e.g. "PressClub <your@email.com>"
#   SMTP_HOST    - smtp-relay.brevo.com
#   SMTP_USER    - Brevo SMTP login
#   SMTP_PASS    - Brevo SMTP key (xsmtpsib-...)
#   BREVO_API_KEY - OPTIONAL: Brevo REST key (xkeysib-...) HTTPS email fallback
#
# LIVE NEWS:
#   NEWS_API_KEY  - newsdata.io API key (https://newsdata.io)
#
# ADS MONETIZATION (Monetag only — zone injected on every page):
#   MONETAG_ZONE_ID - your Monetag multi-tag zone id
#   MONETAG_TAG_URL - the tag.min.js URL from the Monetag snippet
#
# OWNER STATS (hidden dashboard):
#   OWNER_CODE      - secret code that unlocks /stats.html & owner APIs
#
# DATABASE (CockroachDB — optional but recommended on Render):
#   DATABASE_URL    - postgres connection string; when set, payments &
#                     ad stats are stored in a pressclub_state table
#                     (JSON files remain as an automatic backup)
#
# AUTOMATED PAYMENTS (optional, Flutterwave):
#   FLUTTERWAVE_SECRET_KEY  - enables instant online payments -> Payer
#   FLUTTERWAVE_PUBLIC_KEY  - Flutterwave public key
#   FLUTTERWAVE_SECRET_HASH - webhook secret hash (Settings -> Webhooks)
#   PAYMENT_AMOUNT          - fixed price in NGN to become a Payer

services:
  - type: web
    name: pressclub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NEWS_API_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_CODE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: 0
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MONETAG_ZONE_ID
        sync: false
      - key: MONETAG_TAG_URL
        value: "https://quge5.com/88/tag.min.js"
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: PAYMENT_AMOUNT
        value: "5000"