# Render.com deployment configuration for PressClub
#
# Render Dashboard -> Your Service -> Environment -> Environment Variables
#
# REQUIRED (set these or they will be prompted during deploy):
#   OWNER_EMAIL  - email that receives verification/contact notifications
#   MAIL_FROM    - sender on outgoing emails, e.g. "PressClub <your@email.com>"
#   SMTP_HOST    - smtp-relay.brevo.com
#   SMTP_USER    - Brevo SMTP login
#   SMTP_PASS    - Brevo SMTP key (xsmtpsib-...)
#   BREVO_API_KEY - OPTIONAL: Brevo REST key (xkeysib-...) HTTPS email fallback
#
# LIVE NEWS:
#   NEWS_API_KEY  - newsdata.io API key (https://newsdata.io)
#
# ADS MONETIZATION (optional):
#   ENABLE_ADS_API - 'true' to fetch ads from an external provider
#   ADS_API_KEY    - ad provider key (never sent to browsers)
#   ADS_API_URL    - ad provider REST endpoint
#
# AUTOMATED PAYMENTS (optional, Flutterwave):
#   FLUTTERWAVE_SECRET_KEY  - enables instant online payments -> Payer
#   FLUTTERWAVE_PUBLIC_KEY  - Flutterwave public key
#   FLUTTERWAVE_SECRET_HASH - webhook secret hash (Settings -> Webhooks)
#   PAYMENT_AMOUNT          - fixed price in NGN to become a Payer

services:
  - type: web
    name: pressclub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NEWS_API_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: 0
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: ENABLE_ADS_API
        value: "false"
      - key: ADS_API_KEY
        sync: false
      - key: ADS_API_URL
        value: "https://ads.provider.com/v1/banners"
      - key: MONETAG_ZONE_ID
        sync: false
      - key: MONETAG_TAG_URL
        value: "https://quge5.com/88/tag.min.js"
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: PAYMENT_AMOUNT
        value: "5000"